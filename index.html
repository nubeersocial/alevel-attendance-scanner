<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    http-equiv="Cache-Control"
    content="no-cache, no-store, must-revalidate"
  >

  <meta
    http-equiv="Pragma"
    content="no-cache"
  >

  <meta
    http-equiv="Expires"
    content="0"
  >

  <title>
    A-Level Attendance Scanner
  </title>


  <script src="https://unpkg.com/html5-qrcode"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        sans-serif;

      background:
        #eef2f5;

      color:
        #1f2937;

    }


    .page {

      width:
        100%;

      max-width:
        620px;

      margin:
        0 auto;

      padding:
        18px;

    }


    /* =========================
       HEADER
       ========================= */


    .header {

      text-align:
        center;

      margin-bottom:
        18px;

    }


    .header h1 {

      margin:
        0;

      font-size:
        28px;

    }


    .header p {

      margin:
        7px 0 0;

      color:
        #6b7280;

      font-size:
        15px;

    }



    /* =========================
       SCANNER
       ========================= */


    .scannerCard {

      background:
        white;

      border-radius:
        18px;

      padding:
        14px;

      box-shadow:
        0 4px 14px
        rgba(0,0,0,0.08);

    }


    #reader {

      width:
        100%;

      overflow:
        hidden;

      border-radius:
        14px;

    }



    /* =========================
       READY
       ========================= */


    #readyMessage {

      margin-top:
        14px;

      padding:
        13px;

      border-radius:
        12px;

      background:
        #e8f5e9;

      color:
        #1b5e20;

      font-size:
        17px;

      font-weight:
        bold;

      text-align:
        center;

    }



    /* =========================
       PROCESSING

       This stays ABOVE the
       result card so it can
       never hide behind it.
       ========================= */


    #processing {

      display:
        none;

      margin-top:
        14px;

      padding:
        13px;

      border-radius:
        12px;

      background:
        #e8eef9;

      color:
        #1f3b73;

      font-size:
        17px;

      font-weight:
        bold;

      text-align:
        center;

      position:
        relative;

      z-index:
        50;

    }



    /* =========================
       RESULT CARD
       ========================= */


    #resultCard {

      display:
        none;

      margin-top:
        18px;

      background:
        white;

      border-radius:
        18px;

      padding:
        22px;

      box-shadow:
        0 4px 14px
        rgba(0,0,0,0.08);

      opacity:
        1;

      transition:
        opacity 0.3s ease;

    }


    #resultCard.fadeOut {

      opacity:
        0;

    }



    #studentName {

      text-align:
        center;

      font-size:
        30px;

      font-weight:
        800;

      margin-bottom:
        4px;

    }


    #studentGroup {

      text-align:
        center;

      font-size:
        18px;

      font-weight:
        bold;

      color:
        #6b7280;

      margin-bottom:
        22px;

    }



    .sectionTitle {

      margin-top:
        18px;

      margin-bottom:
        8px;

      font-size:
        12px;

      font-weight:
        800;

      color:
        #6b7280;

      letter-spacing:
        0.8px;

      text-transform:
        uppercase;

    }



    #classes {

      font-size:
        18px;

      line-height:
        1.8;

      background:
        #f8fafc;

      padding:
        14px;

      border-radius:
        12px;

    }



    .timeGrid {

      display:
        grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        12px;

      margin-top:
        10px;

    }



    .timeBox {

      background:
        #f8fafc;

      padding:
        15px;

      border-radius:
        12px;

      text-align:
        center;

    }



    .timeLabel {

      font-size:
        12px;

      color:
        #6b7280;

      margin-bottom:
        6px;

      text-transform:
        uppercase;

      font-weight:
        bold;

    }



    .timeValue {

      font-size:
        21px;

      font-weight:
        800;

    }



    #statusBox {

      margin-top:
        20px;

      padding:
        18px;

      border-radius:
        14px;

      text-align:
        center;

      font-size:
        24px;

      font-weight:
        800;

    }



    .success {

      background:
        #e8f5e9;

      color:
        #1b5e20;

    }



    .late {

      background:
        #ffebee;

      color:
        #b71c1c;

    }



    .duplicate {

      background:
        #fff3e0;

      color:
        #e65100;

    }



    .error {

      background:
        #ffebee;

      color:
        #b71c1c;

    }



    .footerNote {

      text-align:
        center;

      color:
        #9ca3af;

      font-size:
        12px;

      margin-top:
        14px;

    }



    /* =========================
       MOBILE
       ========================= */


    @media (max-width: 480px) {


      .page {

        padding:
          12px;

      }


      .header h1 {

        font-size:
          24px;

      }


      #studentName {

        font-size:
          26px;

      }


      .timeValue {

        font-size:
          18px;

      }


      #statusBox {

        font-size:
          21px;

      }


    }


  </style>

</head>



<body>


  <div class="page">


    <!-- HEADER -->

    <div class="header">

      <h1>
        A-Level Attendance
      </h1>

      <p>
        Scan student QR code
      </p>

    </div>



    <!-- SCANNER -->

    <div class="scannerCard">


      <div id="reader"></div>


      <div id="readyMessage">

        Ready to scan

      </div>


      <div id="processing">

        Processing...

      </div>


    </div>



    <!-- RESULT -->

    <div id="resultCard">


      <div id="studentName"></div>


      <div id="studentGroup"></div>



      <div class="sectionTitle">

        Today's Classes

      </div>


      <div id="classes"></div>



      <div class="sectionTitle">

        Arrival

      </div>



      <div class="timeGrid">


        <div class="timeBox">


          <div class="timeLabel">

            Expected

          </div>


          <div
            class="timeValue"
            id="expectedArrival">
          </div>


        </div>



        <div class="timeBox">


          <div class="timeLabel">

            Actual

          </div>


          <div
            class="timeValue"
            id="actualArrival">
          </div>


        </div>


      </div>



      <div id="statusBox"></div>


    </div>



    <div class="footerNote">

      A-Level Student Arrival System

    </div>


  </div>



  <script>


    /* =========================================
       WEB APP
       ========================================= */


    const WEB_APP_URL =

      "https://script.google.com/macros/s/AKfycbxFMgFv1cEijDef2vJQ5FXgkJ7xxcx5IG3BKiPuToEqoHFLk2dKDavzlOFBcDt5HMPO/exec";



    /* =========================================
       SETTINGS
       ========================================= */


    const SAME_QR_DELAY =
      5000;


    const REQUEST_TIMEOUT =
      8000;


    const RESULT_VISIBLE_MS =
      3000;



    /* =========================================
       STATE
       ========================================= */


    let isProcessing =
      false;


    let lastScannedQR =
      "";


    let lastScanTime =
      0;


    let resultTimer =
      null;


    let fadeTimer =
      null;



    /* =========================================
       RESULT TIMER
       ========================================= */


    function cancelResultTimer() {


      if (
        resultTimer
      ) {


        clearTimeout(
          resultTimer
        );


        resultTimer =
          null;


      }



      if (
        fadeTimer
      ) {


        clearTimeout(
          fadeTimer
        );


        fadeTimer =
          null;


      }



      const card =

        document.getElementById(
          "resultCard"
        );



      card.classList.remove(
        "fadeOut"
      );


    }



    function scheduleResultHide() {


      cancelResultTimer();



      resultTimer =

        setTimeout(

          function() {


            const card =

              document.getElementById(
                "resultCard"
              );



            card.classList.add(
              "fadeOut"
            );



            fadeTimer =

              setTimeout(

                function() {


                  if (

                    card
                      .classList
                      .contains(
                        "fadeOut"
                      )

                  ) {


                    card.style.display =
                      "none";


                    card
                      .classList
                      .remove(
                        "fadeOut"
                      );


                  }


                },

                300

              );


          },

          RESULT_VISIBLE_MS

        );


    }



    /* =========================================
       CLASS FORMAT
       ========================================= */


    function formatClasses(
      classText
    ) {


      if (
        !classText
      ) {


        return "No classes";


      }



      return classText

        .split(
          " | "
        )

        .map(

          item =>

            "<div>" +
            item +
            "</div>"

        )

        .join(
          ""
        );


    }



    /* =========================================
       LATE FORMAT
       ========================================= */


    function formatLateTime(
      totalMinutes
    ) {


      totalMinutes =

        Number(
          totalMinutes
        ) || 0;



      if (
        totalMinutes <= 0
      ) {


        return "";


      }



      const hours =

        Math.floor(
          totalMinutes / 60
        );



      const minutes =

        totalMinutes % 60;



      let result =
        "";



      if (
        hours > 0
      ) {


        result +=

          hours +

          (
            hours === 1
              ? " HR"
              : " HRS"
          );


      }



      if (
        minutes > 0
      ) {


        if (
          result
        ) {


          result +=
            " ";


        }



        result +=

          minutes +
          " MIN";


      }



      return result;


    }



    /* =========================================
       SHOW RESULT
       ========================================= */


    function showResult(
      data
    ) {


      /*
        Stop any old result timer.

        New student's result now replaces
        previous student's result.
      */


      cancelResultTimer();



      document
        .getElementById(
          "processing"
        )
        .style
        .display =
        "none";



      const resultCard =

        document.getElementById(
          "resultCard"
        );



      resultCard
        .classList
        .remove(
          "fadeOut"
        );



      resultCard.style.display =
        "block";



      document
        .getElementById(
          "studentName"
        )
        .innerText =

        data.studentName ||
        "";



      document
        .getElementById(
          "studentGroup"
        )
        .innerText =

        data.group

          ? "Class " +
            data.group

          : "";



      document
        .getElementById(
          "classes"
        )
        .innerHTML =

        formatClasses(
          data.todaysClasses
        );



      document
        .getElementById(
          "expectedArrival"
        )
        .innerText =

        data.expectedArrival ||
        "—";



      document
        .getElementById(
          "actualArrival"
        )
        .innerText =

        data.actualArrival ||
        "—";



      const statusBox =

        document.getElementById(
          "statusBox"
        );



      statusBox.className =
        "";



      /* ================================
         DUPLICATE
         ================================ */


      if (

        data.result ===
        "ALREADY RECORDED"

      ) {


        const recordedTime =

          data.actualArrival ||
          "Unknown time";



        statusBox.innerHTML =

          "ALREADY ENTERED" +

          "<br>" +

          "<span style='font-size:16px;font-weight:600;'>" +

          "Arrival recorded at " +

          recordedTime +

          "</span>";



        statusBox.classList.add(
          "duplicate"
        );


      }



      /* ================================
         LATE
         ================================ */


      else if (

        data.attendanceStatus ===
        "Late"

      ) {


        const lateTime =

          formatLateTime(
            data.minutesLate
          );



        let message =
          "LATE";



        if (
          lateTime
        ) {


          message +=

            " — " +
            lateTime;


        }



        statusBox.innerText =
          message;



        statusBox.classList.add(
          "late"
        );


      }



      /* ================================
         ON TIME
         ================================ */


      else if (

        data.attendanceStatus ===
        "On Time"

      ) {


        statusBox.innerText =
          "✓ ON TIME";



        statusBox.classList.add(
          "success"
        );


      }



      /* ================================
         OTHER
         ================================ */


      else {


        statusBox.innerText =

          data.result ||
          "UNKNOWN RESULT";



        statusBox.classList.add(
          "error"
        );


      }



      /*
        Leave result visible for
        three seconds.
      */


      scheduleResultHide();


    }



    /* =========================================
       CONNECTION ERROR
       ========================================= */


    function showConnectionError() {


      cancelResultTimer();



      document
        .getElementById(
          "processing"
        )
        .style
        .display =
        "none";



      const resultCard =

        document.getElementById(
          "resultCard"
        );



      resultCard
        .classList
        .remove(
          "fadeOut"
        );



      resultCard.style.display =
        "block";



      document
        .getElementById(
          "studentName"
        )
        .innerText =

        "Connection Error";



      document
        .getElementById(
          "studentGroup"
        )
        .innerText =
        "";



      document
        .getElementById(
          "classes"
        )
        .innerText =
        "";



      document
        .getElementById(
          "expectedArrival"
        )
        .innerText =
        "—";



      document
        .getElementById(
          "actualArrival"
        )
        .innerText =
        "—";



      const statusBox =

        document.getElementById(
          "statusBox"
        );



      statusBox.innerText =
        "PLEASE SCAN AGAIN";



      statusBox.className =
        "error";



      scheduleResultHide();


    }



    /* =========================================
       READY
       ========================================= */


    function readyForNextStudent() {


      /*
        Unlock immediately after
        server response.
      */


      isProcessing =
        false;



      document
        .getElementById(
          "processing"
        )
        .style
        .display =
        "none";



      document
        .getElementById(
          "readyMessage"
        )
        .innerText =
        "Ready for next student";



      document
        .getElementById(
          "readyMessage"
        )
        .style
        .display =
        "block";


    }



    /* =========================================
       SEND REQUEST
       ========================================= */


    function sendScanRequest(
      qr
    ) {


      let finished =
        false;


      let timeoutTimer =
        null;



      const callbackName =

        "attendanceCallback_" +

        Date.now() +

        "_" +

        Math
          .random()
          .toString(36)
          .substring(
            2,
            10
          );



      const script =

        document.createElement(
          "script"
        );



      /* =====================================
         CLEANUP
         ===================================== */


      function cleanup() {


        if (
          timeoutTimer
        ) {


          clearTimeout(
            timeoutTimer
          );


          timeoutTimer =
            null;


        }



        if (
          script.parentNode
        ) {


          script.parentNode
            .removeChild(
              script
            );


        }



        /*
          Neutralise callback first.

          This protects against a very
          late Apps Script response.
        */


        window[
          callbackName
        ] = function() {};



        setTimeout(

          function() {


            try {


              delete window[
                callbackName
              ];


            }


            catch (error) {


              window[
                callbackName
              ] =
                undefined;


            }


          },

          1000

        );


      }



      /* =====================================
         FAILURE
         ===================================== */


      function failRequest() {


        if (
          finished
        ) {


          return;


        }



        finished =
          true;



        cleanup();



        showConnectionError();



        readyForNextStudent();


      }



      /* =====================================
         SUCCESS
         ===================================== */


      window[
        callbackName
      ] =

        function(
          response
        ) {


          if (
            finished
          ) {


            return;


          }



          finished =
            true;



          cleanup();



          if (

            response &&
            response.result

          ) {


            showResult(
              response.result
            );


          }


          else {


            showConnectionError();


          }



          /*
            Scanner becomes available
            immediately.

            We DO NOT wait three seconds
            for result card to disappear.
          */


          readyForNextStudent();


        };



      /* =====================================
         SCRIPT ERROR
         ===================================== */


      script.onerror =
        failRequest;



      /* =====================================
         TIMEOUT
         ===================================== */


      timeoutTimer =

        setTimeout(

          failRequest,

          REQUEST_TIMEOUT

        );



      /* =====================================
         URL
         ===================================== */


      script.src =

        WEB_APP_URL +

        "?key=" +

        encodeURIComponent(
          qr
        ) +

        "&callback=" +

        encodeURIComponent(
          callbackName
        ) +

        "&t=" +

        Date.now();



      document
        .body
        .appendChild(
          script
        );


    }



    /* =========================================
       QR DETECTED
       ========================================= */


    function onScanSuccess(
      decodedText
    ) {


      const qr =

        decodedText.trim();



      const now =

        Date.now();



      /*
        Ignore detections while actual
        backend request is active.
      */


      if (
        isProcessing
      ) {


        return;


      }



      /*
        Stop same QR repeatedly triggering
        while held in front of camera.
      */


      if (

        qr ===
        lastScannedQR &&

        (
          now -
          lastScanTime
        ) <

        SAME_QR_DELAY

      ) {


        return;


      }



      lastScannedQR =
        qr;



      lastScanTime =
        now;



      /*
        IMPORTANT:

        Do NOT hide the previous result.

        We only stop its fade timer so
        it remains visible while the new
        student is processing.
      */


      cancelResultTimer();



      isProcessing =
        true;



      /*
        Hide READY.
      */


      document
        .getElementById(
          "readyMessage"
        )
        .style
        .display =
        "none";



      /*
        Show PROCESSING clearly ABOVE
        previous result.
      */


      document
        .getElementById(
          "processing"
        )
        .innerText =
        "Processing next student...";



      document
        .getElementById(
          "processing"
        )
        .style
        .display =
        "block";



      /*
        Previous result remains below it.
      */


      sendScanRequest(
        qr
      );


    }



    /* =========================================
       CAMERA
       ========================================= */


    const scanner =

      new Html5QrcodeScanner(

        "reader",

        {

          fps:
            15,

          qrbox:
            250,

          verbose:
            false

        },

        false

      );



    scanner.render(
      onScanSuccess
    );


  </script>


</body>

</html>
