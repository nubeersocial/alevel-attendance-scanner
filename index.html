<!DOCTYPE html>

<html>

<head>

  <meta charset="UTF-8">


  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >


  <meta
    http-equiv="Cache-Control"
    content="no-cache, no-store, must-revalidate"
  >


  <meta
    http-equiv="Pragma"
    content="no-cache"
  >


  <meta
    http-equiv="Expires"
    content="0"
  >


  <title>
    A-Level Attendance Scanner
  </title>


  <script
    src="https://unpkg.com/html5-qrcode">
  </script>



  <style>


    * {

      box-sizing:
        border-box;

    }



    body {

      margin:
        0;

      font-family:
        Arial,
        sans-serif;

      background:
        #eef2f5;

      color:
        #1f2937;

    }



    .page {

      width:
        100%;

      max-width:
        620px;

      margin:
        0 auto;

      padding:
        8px;

    }



    .header {

      text-align:
        center;

      margin-bottom:
        6px;

    }



    .header h1 {

      margin:
        0;

      font-size:
        22px;

    }



    .header p {

      margin:
        3px 0 0;

      color:
        #6b7280;

      font-size:
        12px;

    }



    .scannerCard {

      background:
        white;

      border-radius:
        14px;

      padding:
        6px;

      box-shadow:
        0 4px 14px
        rgba(0,0,0,0.08);

    }



    #reader {

      width:
        100%;

      overflow:
        hidden;

      border-radius:
        10px;

    }



    #readyMessage {

      margin-top:
        5px;

      padding:
        7px;

      border-radius:
        9px;

      background:
        #e8f5e9;

      color:
        #1b5e20;

      font-size:
        14px;

      font-weight:
        bold;

      text-align:
        center;

    }



    #processing {

      display:
        none;

      margin-top:
        5px;

      padding:
        7px;

      border-radius:
        9px;

      background:
        #e8eef9;

      color:
        #1f3b73;

      font-size:
        14px;

      font-weight:
        bold;

      text-align:
        center;

    }



    #resultCard {

      display:
        none;

      margin-top:
        8px;

      background:
        white;

      border-radius:
        14px;

      padding:
        15px;

      box-shadow:
        0 4px 14px
        rgba(0,0,0,0.08);

    }



    .studentTop {

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      gap:
        10px;

    }



    #studentName {

      font-size:
        24px;

      font-weight:
        800;

      line-height:
        1.15;

    }



    #studentGroup {

      flex-shrink:
        0;

      font-size:
        14px;

      font-weight:
        bold;

      color:
        #4b5563;

      background:
        #f3f4f6;

      padding:
        6px 9px;

      border-radius:
        8px;

    }



    .timeGrid {

      display:
        grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        9px;

      margin-top:
        12px;

    }



    .timeBox {

      background:
        #f8fafc;

      padding:
        10px;

      border-radius:
        9px;

      text-align:
        center;

    }



    .timeLabel {

      font-size:
        11px;

      color:
        #6b7280;

      text-transform:
        uppercase;

      font-weight:
        bold;

      margin-bottom:
        3px;

    }



    .timeValue {

      font-size:
        19px;

      font-weight:
        800;

    }



    #statusBox {

      margin-top:
        9px;

      padding:
        11px;

      border-radius:
        9px;

      text-align:
        center;

      font-size:
        20px;

      font-weight:
        800;

    }



    .success {

      background:
        #e8f5e9;

      color:
        #1b5e20;

    }



    .late {

      background:
        #ffebee;

      color:
        #b71c1c;

    }



    .duplicate {

      background:
        #fff3e0;

      color:
        #e65100;

    }



    .error {

      background:
        #ffebee;

      color:
        #b71c1c;

    }



    .classesLabel {

      margin-top:
        12px;

      margin-bottom:
        5px;

      font-size:
        12px;

      font-weight:
        800;

      color:
        #6b7280;

      text-transform:
        uppercase;

    }



    #classes {

      font-size:
        16px;

      line-height:
        1.55;

      font-weight:
        600;

      background:
        #f8fafc;

      padding:
        10px;

      border-radius:
        8px;

    }



    #classes div {

      padding:
        2px 0;

    }



    .footerNote {

      text-align:
        center;

      color:
        #9ca3af;

      font-size:
        10px;

      margin-top:
        7px;

    }



    .hiddenRequestFrame {

      position:
        absolute;

      width:
        1px;

      height:
        1px;

      left:
        -9999px;

      top:
        -9999px;

      border:
        0;

      visibility:
        hidden;

    }



    @media (
      max-width:
      480px
    ) {


      .page {

        padding:
          6px;

      }


      .header h1 {

        font-size:
          20px;

      }


      .header p {

        font-size:
          11px;

      }


      #studentName {

        font-size:
          22px;

      }


      #statusBox {

        font-size:
          19px;

      }


      .timeValue {

        font-size:
          18px;

      }


      #classes {

        font-size:
          16px;

      }

    }


  </style>


</head>



<body>


  <div
    class="page"
  >


    <div
      class="header"
    >


      <h1>
        A-Level Attendance
      </h1>


      <p>
        Scan student QR code
      </p>


    </div>



    <div
      class="scannerCard"
    >


      <div
        id="reader"
      ></div>


      <div
        id="readyMessage"
      >

        Ready to scan

      </div>


      <div
        id="processing"
      >

        Processing next student...

      </div>


    </div>



    <div
      id="resultCard"
    >


      <div
        class="studentTop"
      >


        <div
          id="studentName"
        ></div>


        <div
          id="studentGroup"
        ></div>


      </div>



      <div
        class="timeGrid"
      >


        <div
          class="timeBox"
        >


          <div
            class="timeLabel"
          >

            Expected

          </div>


          <div
            class="timeValue"
            id="expectedArrival"
          ></div>


        </div>



        <div
          class="timeBox"
        >


          <div
            class="timeLabel"
          >

            Actual

          </div>


          <div
            class="timeValue"
            id="actualArrival"
          ></div>


        </div>


      </div>



      <div
        id="statusBox"
      ></div>



      <div
        class="classesLabel"
      >

        Today's Classes

      </div>


      <div
        id="classes"
      ></div>


    </div>



    <div
      class="footerNote"
    >

      A-Level Student Arrival System

    </div>


  </div>



  <script>


    const WEB_APP_URL =

      "https://script.google.com/macros/s/AKfycbxFMgFv1cEijDef2vJQ5FXgkJ7xxcx5IG3BKiPuToEqoHFLk2dKDavzlOFBcDt5HMPO/exec";



    const SAME_QR_DELAY =
      5000;



    /*
      Backend normally finishes
      in roughly 1–2 seconds.

      We give the iframe 6 seconds.
    */

    const REQUEST_TIMEOUT =
      6000;



    let isProcessing =
      false;



    let lastScannedQR =
      "";



    let lastScanTime =
      0;



    let activeRequest =
      null;



    function formatClasses(
      classText
    ) {


      if (!classText) {

        return "No classes";

      }


      return classText

        .split(
          " | "
        )

        .map(

          item =>

            "<div>" +
            item +
            "</div>"

        )

        .join("");

    }



    function formatLateTime(
      totalMinutes
    ) {


      totalMinutes =
        Number(
          totalMinutes
        ) || 0;


      if (
        totalMinutes <= 0
      ) {

        return "";

      }


      const hours =
        Math.floor(
          totalMinutes / 60
        );


      const minutes =
        totalMinutes % 60;


      let result =
        "";


      if (
        hours > 0
      ) {


        result +=

          hours +

          (
            hours === 1

              ? " HR"

              : " HRS"
          );

      }


      if (
        minutes > 0
      ) {


        if (
          result
        ) {

          result +=
            " ";

        }


        result +=

          minutes +

          " MIN";

      }


      return result;

    }



    function showResult(
      data
    ) {


      const resultCard =

        document.getElementById(
          "resultCard"
        );


      resultCard.style.display =
        "block";



      document.getElementById(
        "studentName"
      ).innerText =

        data.studentName ||
        "";



      document.getElementById(
        "studentGroup"
      ).innerText =

        data.group ||
        "";



      document.getElementById(
        "expectedArrival"
      ).innerText =

        data.expectedArrival ||
        "—";



      document.getElementById(
        "actualArrival"
      ).innerText =

        data.actualArrival ||
        "—";



      document.getElementById(
        "classes"
      ).innerHTML =

        formatClasses(
          data.todaysClasses
        );



      const statusBox =

        document.getElementById(
          "statusBox"
        );


      statusBox.className =
        "";



      if (
        data.result ===
        "ALREADY RECORDED"
      ) {


        const recordedTime =

          data.actualArrival ||
          "Unknown time";


        statusBox.innerHTML =

          "ALREADY ENTERED" +

          "<br>" +

          "<span style='font-size:14px;font-weight:600;'>" +

          "Arrival recorded at " +

          recordedTime +

          "</span>";


        statusBox.classList.add(
          "duplicate"
        );

      }



      else if (
        data.attendanceStatus ===
        "Late"
      ) {


        const lateTime =

          formatLateTime(
            data.minutesLate
          );


        let message =
          "LATE";


        if (
          lateTime
        ) {


          message +=

            " — " +

            lateTime;

        }


        statusBox.innerText =
          message;


        statusBox.classList.add(
          "late"
        );

      }



      else if (
        data.attendanceStatus ===
        "On Time"
      ) {


        statusBox.innerText =
          "✓ ON TIME";


        statusBox.classList.add(
          "success"
        );

      }



      else {


        statusBox.innerText =

          data.result ||
          "UNKNOWN RESULT";


        statusBox.classList.add(
          "error"
        );

      }

    }



    function showConnectionError() {


      const resultCard =

        document.getElementById(
          "resultCard"
        );


      resultCard.style.display =
        "block";



      document.getElementById(
        "studentName"
      ).innerText =
        "Connection Error";


      document.getElementById(
        "studentGroup"
      ).innerText =
        "";


      document.getElementById(
        "expectedArrival"
      ).innerText =
        "—";


      document.getElementById(
        "actualArrival"
      ).innerText =
        "—";


      document.getElementById(
        "classes"
      ).innerText =
        "";



      const statusBox =

        document.getElementById(
          "statusBox"
        );


      statusBox.innerText =
        "PLEASE SCAN AGAIN";


      statusBox.className =
        "error";

    }



    function readyForNextStudent() {


      isProcessing =
        false;



      document.getElementById(
        "processing"
      ).style.display =
        "none";



      document.getElementById(
        "readyMessage"
      ).innerText =
        "Ready for next student";



      document.getElementById(
        "readyMessage"
      ).style.display =
        "block";

    }



    function removeActiveRequest() {


      if (
        !activeRequest
      ) {

        return;

      }



      if (
        activeRequest.timeout
      ) {

        clearTimeout(
          activeRequest.timeout
        );

      }



      if (
        activeRequest.frame &&
        activeRequest.frame.parentNode
      ) {


        activeRequest.frame
          .parentNode
          .removeChild(
            activeRequest.frame
          );

      }



      activeRequest =
        null;

    }



    function sendIframeRequest(
      qr,
      attempt = 0
    ) {


      const requestId =

        "attendance_" +

        Date.now() +

        "_" +

        Math.random()
          .toString(36)
          .substring(2,10);



      const iframe =

        document.createElement(
          "iframe"
        );


      iframe.className =
        "hiddenRequestFrame";



      activeRequest = {

        requestId:
          requestId,

        qr:
          qr,

        attempt:
          attempt,

        frame:
          iframe,

        timeout:
          null

      };



      const timeout =

        setTimeout(

          function() {


            if (
              !activeRequest ||
              activeRequest.requestId !==
              requestId
            ) {

              return;

            }



            removeActiveRequest();



            /*
              Retry once.

              If first attendance was
              already recorded, backend
              duplicate protection will
              return ALREADY RECORDED.
            */

            if (
              attempt === 0
            ) {


              document.getElementById(
                "processing"
              ).innerText =
                "Processing...";


              setTimeout(

                function() {


                  sendIframeRequest(
                    qr,
                    1
                  );


                },

                100

              );


              return;

            }



            showConnectionError();


            readyForNextStudent();


          },

          REQUEST_TIMEOUT

        );



      activeRequest.timeout =
        timeout;



      iframe.src =

        WEB_APP_URL +

        "?key=" +

        encodeURIComponent(
          qr
        ) +

        "&requestId=" +

        encodeURIComponent(
          requestId
        ) +

        "&t=" +

        Date.now();



      document.body.appendChild(
        iframe
      );

    }



    window.addEventListener(

      "message",

      function(
        event
      ) {


        const response =
          event.data;



        if (
          !response ||
          response.type !==
          "KIMS_ATTENDANCE_RESPONSE"
        ) {

          return;

        }



        if (
          !activeRequest
        ) {

          return;

        }



        if (
          response.requestId !==
          activeRequest.requestId
        ) {

          return;

        }



        removeActiveRequest();



        if (
          response.result
        ) {


          showResult(
            response.result
          );


        }


        else {


          showConnectionError();

        }



        readyForNextStudent();


      }

    );



    function onScanSuccess(
      decodedText
    ) {


      const qr =

        decodedText.trim();



      const now =
        Date.now();



      if (
        isProcessing
      ) {

        return;

      }



      if (

        qr === lastScannedQR &&

        now - lastScanTime <
        SAME_QR_DELAY

      ) {

        return;

      }



      lastScannedQR =
        qr;


      lastScanTime =
        now;


      isProcessing =
        true;



      document.getElementById(
        "readyMessage"
      ).style.display =
        "none";



      document.getElementById(
        "processing"
      ).innerText =
        "Processing next student...";



      document.getElementById(
        "processing"
      ).style.display =
        "block";



      sendIframeRequest(
        qr
      );

    }



    const scanner =

      new Html5QrcodeScanner(

        "reader",

        {

          fps:
            15,


          qrbox: {

            width:
              220,

            height:
              220

          },


          aspectRatio:
            1.7777778,


          verbose:
            false

        },

        false

      );



    scanner.render(
      onScanSuccess
    );


  </script>


</body>

</html>
