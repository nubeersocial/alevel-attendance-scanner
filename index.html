<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    http-equiv="Cache-Control"
    content="no-cache, no-store, must-revalidate"
  >

  <meta
    http-equiv="Pragma"
    content="no-cache"
  >

  <meta
    http-equiv="Expires"
    content="0"
  >

  <title>KIMS A-Level Attendance</title>


  <script src="https://unpkg.com/html5-qrcode"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;

      font-family:
        Arial,
        sans-serif;

      background:
        #eef2f5;

      color:
        #1f2937;
    }


    .page {
      width: 100%;
      max-width: 620px;

      margin:
        0 auto;

      padding:
        12px;
    }


    /* ==========================
       HEADER
       ========================== */

    .header {
      text-align:
        center;

      margin-bottom:
        10px;
    }


    .header h1 {
      margin:
        0;

      font-size:
        24px;
    }


    .header p {
      margin:
        4px 0 0;

      color:
        #6b7280;

      font-size:
        13px;
    }


    .version {
      margin-top:
        4px;

      font-size:
        10px;

      color:
        #9ca3af;
    }


    /* ==========================
       CAMERA
       ========================== */

    .scannerCard {
      background:
        white;

      border-radius:
        16px;

      padding:
        10px;

      box-shadow:
        0 4px 14px
        rgba(0,0,0,0.08);
    }


    /*
      IMPORTANT:

      We are NOT forcing video height,
      width, object-fit or flex anymore.

      html5-qrcode controls its own
      camera layout.
    */

    #reader {
      width:
        100%;

      overflow:
        hidden;

      border-radius:
        12px;
    }


    /* ==========================
       READY / PROCESSING
       ========================== */

    #readyMessage {
      margin-top:
        8px;

      padding:
        9px;

      border-radius:
        9px;

      background:
        #e8f5e9;

      color:
        #1b5e20;

      font-size:
        14px;

      font-weight:
        bold;

      text-align:
        center;
    }


    #processing {
      display:
        none;

      margin-top:
        8px;

      padding:
        9px;

      border-radius:
        9px;

      background:
        #e8eef9;

      color:
        #1f3b73;

      font-size:
        14px;

      font-weight:
        bold;

      text-align:
        center;
    }


    /* ==========================
       RESULT CARD
       ========================== */

    #resultCard {

      display:
        none;

      background:
        white;

      border-radius:
        17px;

      padding:
        16px;

      box-shadow:
        0 8px 30px
        rgba(0,0,0,0.18);

      opacity:
        1;

      transform:
        translateY(0);

      transition:
        opacity 0.35s ease,
        transform 0.35s ease;

    }


    #resultCard.resultFading {

      opacity:
        0;

      transform:
        translateY(15px);

    }


    #studentName {

      text-align:
        center;

      font-size:
        27px;

      font-weight:
        800;

      margin-bottom:
        2px;

    }


    #studentGroup {

      text-align:
        center;

      font-size:
        15px;

      font-weight:
        bold;

      color:
        #6b7280;

      margin-bottom:
        10px;

    }


    .sectionTitle {

      margin-top:
        8px;

      margin-bottom:
        4px;

      font-size:
        10px;

      font-weight:
        800;

      color:
        #6b7280;

      letter-spacing:
        0.7px;

      text-transform:
        uppercase;

    }


    #classes {

      font-size:
        14px;

      line-height:
        1.35;

      background:
        #f8fafc;

      padding:
        8px 10px;

      border-radius:
        9px;

    }


    .timeGrid {

      display:
        grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        8px;

      margin-top:
        5px;

    }


    .timeBox {

      background:
        #f8fafc;

      padding:
        8px;

      border-radius:
        9px;

      text-align:
        center;

    }


    .timeLabel {

      font-size:
        9px;

      color:
        #6b7280;

      margin-bottom:
        3px;

      text-transform:
        uppercase;

      font-weight:
        bold;

    }


    .timeValue {

      font-size:
        17px;

      font-weight:
        800;

    }


    #statusBox {

      margin-top:
        9px;

      padding:
        10px;

      border-radius:
        10px;

      text-align:
        center;

      font-size:
        19px;

      font-weight:
        800;

    }


    .success {

      background:
        #e8f5e9;

      color:
        #1b5e20;

    }


    .late {

      background:
        #ffebee;

      color:
        #b71c1c;

    }


    .duplicate {

      background:
        #fff3e0;

      color:
        #e65100;

    }


    .error {

      background:
        #ffebee;

      color:
        #b71c1c;

    }


    .footerNote {

      text-align:
        center;

      color:
        #9ca3af;

      font-size:
        11px;

      margin-top:
        10px;

    }


    /* ====================================
       PHONE

       Result appears as bottom sheet.

       Camera stays exactly where it is.
       ==================================== */

    @media (max-width: 700px) {

      .page {

        padding:
          8px;

      }


      .header {

        margin-bottom:
          7px;

      }


      .header h1 {

        font-size:
          20px;

      }


      .header p {

        font-size:
          11px;

      }


      .scannerCard {

        padding:
          7px;

        border-radius:
          13px;

      }


      #readyMessage,
      #processing {

        margin-top:
          5px;

        padding:
          6px;

        font-size:
          12px;

      }


      /*
        Result sits over bottom of screen.

        NO scrolling is required.
      */

      #resultCard {

        position:
          fixed;

        left:
          8px;

        right:
          8px;

        bottom:
          8px;

        z-index:
          9999;

        margin:
          0;

        padding:
          11px 12px;

        max-height:
          43vh;

        overflow-y:
          auto;

        border:
          1px solid
          rgba(0,0,0,0.08);

      }


      #studentName {

        font-size:
          21px;

      }


      #studentGroup {

        font-size:
          12px;

        margin-bottom:
          5px;

      }


      .sectionTitle {

        margin-top:
          5px;

        margin-bottom:
          2px;

        font-size:
          8px;

      }


      #classes {

        font-size:
          11px;

        line-height:
          1.25;

        padding:
          5px 7px;

      }


      .timeGrid {

        gap:
          5px;

        margin-top:
          3px;

      }


      .timeBox {

        padding:
          5px;

      }


      .timeLabel {

        font-size:
          8px;

      }


      .timeValue {

        font-size:
          14px;

      }


      #statusBox {

        margin-top:
          6px;

        padding:
          7px;

        font-size:
          16px;

      }

    }


  </style>

</head>


<body>


<div class="page">


  <div class="header">

    <h1>
      KIMS A-Level Attendance
    </h1>

    <p>
      Scan student QR code
    </p>

    <div class="version">
      Scanner V3
    </div>

  </div>



  <div class="scannerCard">


    <div id="reader"></div>


    <div id="readyMessage">

      Ready to scan

    </div>


    <div id="processing">

      Processing...

    </div>


  </div>



  <div id="resultCard">


    <div id="studentName"></div>


    <div id="studentGroup"></div>



    <div class="sectionTitle">

      Today's Classes

    </div>


    <div id="classes"></div>



    <div class="sectionTitle">

      Arrival

    </div>



    <div class="timeGrid">


      <div class="timeBox">


        <div class="timeLabel">

          Expected

        </div>


        <div
          class="timeValue"
          id="expectedArrival">
        </div>


      </div>



      <div class="timeBox">


        <div class="timeLabel">

          Actual

        </div>


        <div
          class="timeValue"
          id="actualArrival">
        </div>


      </div>


    </div>



    <div id="statusBox"></div>


  </div>



  <div class="footerNote">

    A-Level Student Arrival System

  </div>


</div>



<script>


  /* ======================================
     APPS SCRIPT
     ====================================== */


  const WEB_APP_URL =
    "https://script.google.com/macros/s/AKfycbxFMgFv1cEijDef2vJQ5FXgkJ7xxcx5IG3BKiPuToEqoHFLk2dKDavzlOFBcDt5HMPO/exec";



  /* ======================================
     SETTINGS
     ====================================== */


  const SAME_QR_DELAY =
    5000;


  const REQUEST_TIMEOUT =
    8000;


  const MAX_ATTEMPTS =
    2;


  const RESULT_VISIBLE_MS =
    4000;



  /* ======================================
     VARIABLES
     ====================================== */


  let isProcessing =
    false;


  let lastScannedQR =
    "";


  let lastScanTime =
    0;


  let resultHideTimer =
    null;


  let fadeFinishTimer =
    null;


  let audioContext =
    null;



  /* ======================================
     SOUND UNLOCK

     Mobile Safari/Chrome sometimes requires
     user interaction before sounds work.

     Any tap on page attempts to unlock it.
     ====================================== */


  function unlockAudio() {

    try {

      if (
        !audioContext
      ) {

        audioContext =
          new (
            window.AudioContext ||
            window.webkitAudioContext
          )();

      }


      if (
        audioContext.state ===
        "suspended"
      ) {

        audioContext.resume();

      }

    }

    catch (error) {

      // Ignore sound errors.

    }

  }



  document.addEventListener(

    "touchstart",

    unlockAudio,

    {
      passive: true
    }

  );



  document.addEventListener(

    "click",

    unlockAudio

  );



  /* ======================================
     BEEP
     ====================================== */


  function playScanBeep() {


    try {


      unlockAudio();


      if (
        !audioContext
      ) {

        return;

      }


      const oscillator =
        audioContext
          .createOscillator();


      const gain =
        audioContext
          .createGain();


      oscillator.type =
        "sine";


      oscillator
        .frequency
        .value =
        1000;


      gain
        .gain
        .setValueAtTime(

          0.001,

          audioContext
            .currentTime

        );


      gain
        .gain
        .exponentialRampToValueAtTime(

          0.25,

          audioContext
            .currentTime +
            0.01

        );


      gain
        .gain
        .exponentialRampToValueAtTime(

          0.001,

          audioContext
            .currentTime +
            0.13

        );


      oscillator
        .connect(
          gain
        );


      gain
        .connect(
          audioContext
            .destination
        );


      oscillator
        .start();


      oscillator
        .stop(

          audioContext
            .currentTime +
            0.14

        );


    }

    catch (error) {

      // Scanning continues even if sound fails.

    }



    if (
      navigator.vibrate
    ) {

      navigator.vibrate(
        50
      );

    }


  }



  /* ======================================
     RESULT FADE TIMER
     ====================================== */


  function cancelResultCollapse() {


    if (
      resultHideTimer
    ) {

      clearTimeout(
        resultHideTimer
      );


      resultHideTimer =
        null;

    }



    if (
      fadeFinishTimer
    ) {

      clearTimeout(
        fadeFinishTimer
      );


      fadeFinishTimer =
        null;

    }



    const card =
      document.getElementById(
        "resultCard"
      );


    card
      .classList
      .remove(
        "resultFading"
      );


  }



  function scheduleResultCollapse() {


    cancelResultCollapse();



    resultHideTimer =
      setTimeout(

        function() {


          const card =
            document.getElementById(
              "resultCard"
            );


          card
            .classList
            .add(
              "resultFading"
            );



          fadeFinishTimer =
            setTimeout(

              function() {


                if (

                  card
                    .classList
                    .contains(
                      "resultFading"
                    )

                ) {


                  card.style.display =
                    "none";


                  card
                    .classList
                    .remove(
                      "resultFading"
                    );


                }


              },

              350

            );


        },

        RESULT_VISIBLE_MS

      );


  }



  /* ======================================
     FORMAT CLASSES
     ====================================== */


  function formatClasses(
    classText
  ) {


    if (
      !classText
    ) {

      return "No classes";

    }



    return classText

      .split(
        " | "
      )

      .map(

        item =>

          "<div>" +
          item +
          "</div>"

      )

      .join(
        ""
      );


  }



  /* ======================================
     LATE TIME
     ====================================== */


  function formatLateTime(
    totalMinutes
  ) {


    totalMinutes =
      Number(
        totalMinutes
      ) || 0;



    if (
      totalMinutes <= 0
    ) {

      return "";

    }



    const hours =
      Math.floor(
        totalMinutes / 60
      );



    const minutes =
      totalMinutes % 60;



    let result =
      "";



    if (
      hours > 0
    ) {


      result +=

        hours +

        (
          hours === 1
            ? " HR"
            : " HRS"
        );


    }



    if (
      minutes > 0
    ) {


      if (
        result
      ) {

        result +=
          " ";

      }



      result +=

        minutes +
        " MIN";


    }



    return result;


  }



  /* ======================================
     SHOW RESULT
     ====================================== */


  function showResult(
    data
  ) {


    cancelResultCollapse();



    document
      .getElementById(
        "processing"
      )
      .style
      .display =
      "none";



    const resultCard =
      document
        .getElementById(
          "resultCard"
        );



    resultCard
      .classList
      .remove(
        "resultFading"
      );



    resultCard
      .style
      .display =
      "block";



    document
      .getElementById(
        "studentName"
      )
      .innerText =

      data.studentName ||
      "";



    document
      .getElementById(
        "studentGroup"
      )
      .innerText =

      data.group

        ? "Class " +
          data.group

        : "";



    document
      .getElementById(
        "classes"
      )
      .innerHTML =

      formatClasses(
        data.todaysClasses
      );



    document
      .getElementById(
        "expectedArrival"
      )
      .innerText =

      data.expectedArrival ||
      "—";



    document
      .getElementById(
        "actualArrival"
      )
      .innerText =

      data.actualArrival ||
      "—";



    const statusBox =
      document
        .getElementById(
          "statusBox"
        );



    statusBox.className =
      "";



    /* ==============================
       ALREADY RECORDED
       ============================== */


    if (

      data.result ===
      "ALREADY RECORDED"

    ) {


      const recordedTime =

        data.actualArrival ||
        "Unknown time";



      statusBox.innerHTML =

        "ALREADY ENTERED" +

        "<br>" +

        "<span style='font-size:12px;font-weight:600;'>" +

        "Arrival recorded at " +

        recordedTime +

        "</span>";



      statusBox
        .classList
        .add(
          "duplicate"
        );


    }



    /* ==============================
       LATE
       ============================== */


    else if (

      data.attendanceStatus ===
      "Late"

    ) {


      const lateTime =
        formatLateTime(
          data.minutesLate
        );



      let message =
        "LATE";



      if (
        lateTime
      ) {


        message +=

          " — " +
          lateTime;


      }



      statusBox.innerText =
        message;



      statusBox
        .classList
        .add(
          "late"
        );


    }



    /* ==============================
       ON TIME
       ============================== */


    else if (

      data.attendanceStatus ===
      "On Time"

    ) {


      statusBox.innerText =
        "✓ ON TIME";



      statusBox
        .classList
        .add(
          "success"
        );


    }



    /* ==============================
       OTHER
       ============================== */


    else {


      statusBox.innerText =

        data.result ||
        "UNKNOWN RESULT";



      statusBox
        .classList
        .add(
          "error"
        );


    }



    /*
      Result stays visible for
      4 seconds.

      Scanner does NOT stay locked.
    */


    scheduleResultCollapse();


  }



  /* ======================================
     CONNECTION ERROR
     ====================================== */


  function showConnectionError() {


    cancelResultCollapse();



    document
      .getElementById(
        "processing"
      )
      .style
      .display =
      "none";



    const resultCard =
      document
        .getElementById(
          "resultCard"
        );



    resultCard.style.display =
      "block";



    document
      .getElementById(
        "studentName"
      )
      .innerText =
      "Connection Error";



    document
      .getElementById(
        "studentGroup"
      )
      .innerText =
      "";



    document
      .getElementById(
        "classes"
      )
      .innerText =
      "";



    document
      .getElementById(
        "expectedArrival"
      )
      .innerText =
      "—";



    document
      .getElementById(
        "actualArrival"
      )
      .innerText =
      "—";



    const statusBox =
      document
        .getElementById(
          "statusBox"
        );



    statusBox.innerText =
      "PLEASE SCAN AGAIN";



    statusBox.className =
      "error";



    scheduleResultCollapse();


  }



  /* ======================================
     READY
     ====================================== */


  function readyForNextStudent() {


    /*
      ONLY server processing lock ends here.

      Result can still remain visible.
    */


    isProcessing =
      false;



    document
      .getElementById(
        "processing"
      )
      .style
      .display =
      "none";



    document
      .getElementById(
        "readyMessage"
      )
      .innerText =
      "Ready for next student";



    document
      .getElementById(
        "readyMessage"
      )
      .style
      .display =
      "block";


  }



  /* ======================================
     SEND REQUEST
     ====================================== */


  function sendScanRequest(
    qr,
    attempt
  ) {


    let finished =
      false;



    const callbackName =

      "attendanceCallback_" +

      Date.now() +

      "_" +

      Math
        .random()
        .toString(36)
        .substring(
          2,
          10
        );



    const script =
      document
        .createElement(
          "script"
        );



    /* CLEANUP */


    function cleanup() {


      if (
        script.parentNode
      ) {


        script
          .parentNode
          .removeChild(
            script
          );


      }



      try {


        delete window[
          callbackName
        ];


      }


      catch (error) {


        window[
          callbackName
        ] =
          undefined;


      }


    }



    /* RETRY */


    function retryOrFail() {


      if (
        finished
      ) {

        return;

      }



      finished =
        true;



      clearTimeout(
        timeoutTimer
      );



      cleanup();



      if (

        attempt <
        MAX_ATTEMPTS

      ) {


        document
          .getElementById(
            "processing"
          )
          .innerText =
          "Confirming attendance...";



        setTimeout(

          function() {


            sendScanRequest(

              qr,

              attempt + 1

            );


          },

          300

        );


      }



      else {


        document
          .getElementById(
            "processing"
          )
          .innerText =
          "Processing...";



        showConnectionError();



        readyForNextStudent();


      }


    }



    /* RESPONSE */


    window[
      callbackName
    ] =

      function(
        response
      ) {


        if (
          finished
        ) {

          return;

        }



        finished =
          true;



        clearTimeout(
          timeoutTimer
        );



        if (

          response &&
          response.result

        ) {


          showResult(
            response.result
          );


        }



        else {


          showConnectionError();


        }



        cleanup();



        document
          .getElementById(
            "processing"
          )
          .innerText =
          "Processing...";



        /*
          Scanner immediately becomes
          available again.

          It does NOT wait 4 seconds.
        */


        readyForNextStudent();


      };



    /* ERROR */


    script.onerror =

      function() {


        retryOrFail();


      };



    /* TIMEOUT */


    const timeoutTimer =

      setTimeout(

        function() {


          retryOrFail();


        },

        REQUEST_TIMEOUT

      );



    /* JSONP */


    script.src =

      WEB_APP_URL +

      "?key=" +

      encodeURIComponent(
        qr
      ) +

      "&callback=" +

      encodeURIComponent(
        callbackName
      ) +

      "&t=" +

      Date.now() +

      "&attempt=" +

      attempt;



    document
      .body
      .appendChild(
        script
      );


  }



  /* ======================================
     QR SUCCESS
     ====================================== */


  function onScanSuccess(
    decodedText
  ) {


    const qr =
      decodedText.trim();



    const now =
      Date.now();



    /*
      Current attendance request
      still processing.
    */


    if (
      isProcessing
    ) {

      return;

    }



    /*
      Ignore repeated reading
      of same card for 5 seconds.
    */


    if (

      qr ===
      lastScannedQR &&

      now -
      lastScanTime <

      SAME_QR_DELAY

    ) {


      return;


    }



    lastScannedQR =
      qr;



    lastScanTime =
      now;



    /*
      Previous result remains visible
      while the NEW scan processes.
    */


    cancelResultCollapse();



    /*
      Immediate feedback.
    */


    playScanBeep();



    isProcessing =
      true;



    document
      .getElementById(
        "readyMessage"
      )
      .style
      .display =
      "none";



    document
      .getElementById(
        "processing"
      )
      .innerText =
      "Processing...";



    document
      .getElementById(
        "processing"
      )
      .style
      .display =
      "block";



    /*
      IMPORTANT:

      We DO NOT hide the previous
      result here.
    */


    sendScanRequest(
      qr,
      1
    );


  }



  /* ======================================
     START ORIGINAL SCANNER
     ====================================== */


  const scanner =

    new Html5QrcodeScanner(

      "reader",

      {

        fps:
          15,

        qrbox:
          250

      },

      false

    );



  scanner.render(
    onScanSuccess
  );


</script>


</body>
</html>
