<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  http-equiv="Cache-Control"
  content="no-cache, no-store, must-revalidate"
>

<meta
  http-equiv="Pragma"
  content="no-cache"
>

<meta
  http-equiv="Expires"
  content="0"
>

<title>A-Level Attendance Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>


<style>

* {
  box-sizing: border-box;
}


body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef2f5;
  color: #1f2937;
}


.page {
  width: 100%;
  max-width: 620px;
  margin: 0 auto;
  padding: 7px;
}


/* =========================
   HEADER
========================= */

.header {
  text-align: center;
  margin-bottom: 5px;
}


.header h1 {
  margin: 0;
  font-size: 21px;
}


.header p {
  margin: 2px 0 0;
  color: #6b7280;
  font-size: 11px;
}


/* =========================
   SCANNER
========================= */

.scannerCard {
  width: 100%;

  background: white;

  border-radius: 13px;

  padding: 5px;

  box-shadow:
    0 3px 10px rgba(0,0,0,0.07);
}


#reader {
  width: 100%;
  overflow: hidden;
  border-radius: 9px;
}


#readyMessage {
  margin-top: 4px;

  padding: 6px;

  border-radius: 8px;

  background: #e8f5e9;
  color: #1b5e20;

  font-size: 13px;
  font-weight: bold;

  text-align: center;
}


#processing {
  display: none;

  margin-top: 4px;

  padding: 6px;

  border-radius: 8px;

  background: #e8eef9;
  color: #1f3b73;

  font-size: 13px;
  font-weight: bold;

  text-align: center;
}


/* =========================
   RESULT CARD
========================= */

#resultCard {
  display: none;

  margin-top: 6px;

  background: white;

  border-radius: 14px;

  padding: 11px;

  box-shadow:
    0 3px 10px rgba(0,0,0,0.08);
}


/* NAME + GROUP SAME ROW */

.studentTop {
  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 8px;
}


#studentName {
  font-size: 22px;

  font-weight: 800;

  line-height: 1.1;
}


#studentGroup {
  flex-shrink: 0;

  font-size: 13px;

  font-weight: 700;

  color: #4b5563;

  background: #f3f4f6;

  padding: 5px 8px;

  border-radius: 8px;
}


/* =========================
   TIMES
========================= */

.timeGrid {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 7px;

  margin-top: 8px;
}


.timeBox {
  background: #f8fafc;

  padding: 7px;

  border-radius: 8px;

  text-align: center;
}


.timeLabel {
  font-size: 10px;

  color: #6b7280;

  margin-bottom: 2px;

  text-transform: uppercase;

  font-weight: bold;
}


.timeValue {
  font-size: 17px;

  font-weight: 800;
}


/* =========================
   STATUS
========================= */

#statusBox {
  margin-top: 7px;

  padding: 9px;

  border-radius: 9px;

  text-align: center;

  font-size: 19px;

  font-weight: 800;
}


.success {
  background: #e8f5e9;
  color: #1b5e20;
}


.late {
  background: #ffebee;
  color: #b71c1c;
}


.duplicate {
  background: #fff3e0;
  color: #e65100;
}


.error {
  background: #ffebee;
  color: #b71c1c;
}


/* =========================
   CLASSES
========================= */

.classesLabel {
  margin-top: 8px;

  margin-bottom: 4px;

  font-size: 11px;

  font-weight: 800;

  color: #6b7280;

  text-transform: uppercase;
}


#classes {
  font-size: 16px;

  line-height: 1.4;

  font-weight: 600;

  background: #f8fafc;

  padding: 8px 9px;

  border-radius: 8px;
}


#classes div {
  padding: 1px 0;
}


/* =========================
   FOOTER
========================= */

.footerNote {
  text-align: center;

  color: #9ca3af;

  font-size: 9px;

  margin-top: 5px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 480px) {

  .page {
    padding: 5px;
  }


  .header {
    margin-bottom: 4px;
  }


  .header h1 {
    font-size: 19px;
  }


  .header p {
    font-size: 10px;
  }


  .scannerCard {
    padding: 4px;
  }


  #readyMessage,
  #processing {
    font-size: 12px;
    padding: 5px;
  }


  #resultCard {
    margin-top: 5px;
    padding: 10px;
  }


  #studentName {
    font-size: 21px;
  }


  #studentGroup {
    font-size: 12px;
  }


  .timeValue {
    font-size: 16px;
  }


  #statusBox {
    font-size: 18px;
    padding: 8px;
  }


  #classes {
    font-size: 16px;
    line-height: 1.35;
  }

}

</style>

</head>


<body>


<div class="page">


  <div class="header">

    <h1>
      A-Level Attendance
    </h1>

    <p>
      Scan student QR code
    </p>

  </div>



  <div class="scannerCard">

    <div id="reader"></div>


    <div id="readyMessage">
      Ready to scan
    </div>


    <div id="processing">
      Processing...
    </div>

  </div>



  <div id="resultCard">


    <div class="studentTop">

      <div id="studentName"></div>

      <div id="studentGroup"></div>

    </div>



    <div class="timeGrid">


      <div class="timeBox">

        <div class="timeLabel">
          Expected
        </div>

        <div
          class="timeValue"
          id="expectedArrival">
        </div>

      </div>



      <div class="timeBox">

        <div class="timeLabel">
          Actual
        </div>

        <div
          class="timeValue"
          id="actualArrival">
        </div>

      </div>


    </div>



    <div id="statusBox"></div>



    <div class="classesLabel">
      Today's Classes
    </div>


    <div id="classes"></div>


  </div>



  <div class="footerNote">
    A-Level Student Arrival System
  </div>


</div>



<script>


const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbxFMgFv1cEijDef2vJQ5FXgkJ7xxcx5IG3BKiPuToEqoHFLk2dKDavzlOFBcDt5HMPO/exec";



let isProcessing =
  false;


let lastScannedQR =
  "";


let lastScanTime =
  0;



const SAME_QR_DELAY =
  5000;



function formatClasses(
  classText
) {


  if (!classText) {

    return "No classes";

  }


  return classText
    .split(" | ")
    .map(

      item =>
        "<div>" +
        item +
        "</div>"

    )
    .join("");

}



function formatLateTime(
  totalMinutes
) {


  totalMinutes =
    Number(totalMinutes) || 0;


  if (
    totalMinutes <= 0
  ) {

    return "";

  }


  const hours =
    Math.floor(
      totalMinutes / 60
    );


  const minutes =
    totalMinutes % 60;


  let result =
    "";


  if (
    hours > 0
  ) {


    result +=
      hours +
      (
        hours === 1
          ? " HR"
          : " HRS"
      );

  }


  if (
    minutes > 0
  ) {


    if (
      result
    ) {

      result +=
        " ";

    }


    result +=
      minutes +
      " MIN";

  }


  return result;

}



function showResult(
  data
) {


  document.getElementById(
    "processing"
  ).style.display =
    "none";



  document.getElementById(
    "resultCard"
  ).style.display =
    "block";



  document.getElementById(
    "studentName"
  ).innerText =
    data.studentName || "";



  document.getElementById(
    "studentGroup"
  ).innerText =
    data.group
      ? "Class " + data.group
      : "";



  document.getElementById(
    "expectedArrival"
  ).innerText =
    data.expectedArrival || "—";



  document.getElementById(
    "actualArrival"
  ).innerText =
    data.actualArrival || "—";



  document.getElementById(
    "classes"
  ).innerHTML =
    formatClasses(
      data.todaysClasses
    );



  const statusBox =
    document.getElementById(
      "statusBox"
    );


  statusBox.className =
    "";



  if (
    data.result ===
    "ALREADY RECORDED"
  ) {


    const recordedTime =
      data.actualArrival ||
      "Unknown time";


    statusBox.innerHTML =
      "ALREADY ENTERED" +
      "<br>" +
      "<span style='font-size:13px;font-weight:600;'>" +
      "Arrival recorded at " +
      recordedTime +
      "</span>";


    statusBox.classList.add(
      "duplicate"
    );

  }



  else if (
    data.attendanceStatus ===
    "Late"
  ) {


    const lateTime =
      formatLateTime(
        data.minutesLate
      );


    let message =
      "LATE";


    if (
      lateTime
    ) {

      message +=
        " — " +
        lateTime;

    }


    statusBox.innerText =
      message;


    statusBox.classList.add(
      "late"
    );

  }



  else if (
    data.attendanceStatus ===
    "On Time"
  ) {


    statusBox.innerText =
      "✓ ON TIME";


    statusBox.classList.add(
      "success"
    );

  }



  else {


    statusBox.innerText =
      data.result ||
      "UNKNOWN RESULT";


    statusBox.classList.add(
      "error"
    );

  }

}



function showConnectionError() {


  document.getElementById(
    "processing"
  ).style.display =
    "none";



  document.getElementById(
    "resultCard"
  ).style.display =
    "block";



  document.getElementById(
    "studentName"
  ).innerText =
    "Connection Error";


  document.getElementById(
    "studentGroup"
  ).innerText =
    "";


  document.getElementById(
    "expectedArrival"
  ).innerText =
    "—";


  document.getElementById(
    "actualArrival"
  ).innerText =
    "—";


  document.getElementById(
    "classes"
  ).innerText =
    "";



  const statusBox =
    document.getElementById(
      "statusBox"
    );


  statusBox.innerText =
    "PLEASE SCAN AGAIN";


  statusBox.className =
    "error";

}



function readyForNextStudent() {


  isProcessing =
    false;



  document.getElementById(
    "processing"
  ).style.display =
    "none";



  document.getElementById(
    "readyMessage"
  ).innerText =
    "Ready for next student";



  document.getElementById(
    "readyMessage"
  ).style.display =
    "block";

}



function sendScanRequest(
  qr
) {


  const callbackName =
    "attendanceCallback_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2, 10);



  const script =
    document.createElement(
      "script"
    );



  function cleanup() {


    if (
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );

    }



    try {

      delete window[
        callbackName
      ];

    }


    catch (error) {

      window[
        callbackName
      ] =
        undefined;

    }

  }



  window[
    callbackName
  ] =
    function(
      response
    ) {


      if (
        response &&
        response.result
      ) {


        showResult(
          response.result
        );

      }


      else {


        showConnectionError();

      }



      cleanup();



      readyForNextStudent();

    };



  script.onerror =
    function() {


      cleanup();


      showConnectionError();


      readyForNextStudent();

    };



  script.src =
    WEB_APP_URL +
    "?key=" +
    encodeURIComponent(
      qr
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    ) +
    "&t=" +
    Date.now();



  document.body
    .appendChild(
      script
    );

}



function onScanSuccess(
  decodedText
) {


  const qr =
    decodedText.trim();


  const now =
    Date.now();



  if (
    isProcessing
  ) {

    return;

  }



  if (
    qr === lastScannedQR &&
    now - lastScanTime <
    SAME_QR_DELAY
  ) {

    return;

  }



  lastScannedQR =
    qr;


  lastScanTime =
    now;


  isProcessing =
    true;



  document.getElementById(
    "readyMessage"
  ).style.display =
    "none";



  document.getElementById(
    "processing"
  ).innerText =
    "Processing...";



  document.getElementById(
    "processing"
  ).style.display =
    "block";



  sendScanRequest(
    qr
  );

}



const scanner =
  new Html5QrcodeScanner(

    "reader",

    {

      fps:
        15,

      qrbox:
        250

    },

    false

  );



scanner.render(
  onScanSuccess
);


</script>


</body>

</html>
