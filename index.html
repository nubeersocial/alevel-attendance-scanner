<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A-Level Attendance Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
    }

    #result {
      max-width: 500px;
      margin: 20px auto;
      padding: 18px;
      background: white;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
      min-height: 30px;
    }
  </style>
</head>

<body>

  <h1>A-Level Attendance Scanner</h1>

  <p>Point the camera at a student QR code.</p>

  <div id="reader"></div>

  <div id="result">
    Ready to scan
  </div>

  <script>
    const WEB_APP_URL =
      "https://script.google.com/macros/s/AKfycbxFMgFv1cEijDef2vJQ5FXgkJ7xxcx5IG3BKiPuToEqoHFLk2dKDavzlOFBcDt5HMPO/exec";

    let isProcessing = false;

    function onScanSuccess(decodedText) {

      if (isProcessing) return;

      isProcessing = true;

      document.getElementById("result").innerText =
        "Processing...";

      const callbackName =
        "callback_" + Date.now();

      const script = document.createElement("script");

      window[callbackName] = function(response) {

        console.log("Backend response:", response);

        if (response && response.result) {
          document.getElementById("result").innerText =
            response.result;
        } else {
          document.getElementById("result").innerText =
            "NO RESPONSE";
        }

        delete window[callbackName];

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

        setTimeout(function() {
          isProcessing = false;
        }, 3000);
      };

      script.onerror = function() {
        document.getElementById("result").innerText =
          "CONNECTION ERROR";

        isProcessing = false;
      };

      script.src =
        WEB_APP_URL +
        "?key=" +
        encodeURIComponent(decodedText.trim()) +
        "&callback=" +
        callbackName;

      document.body.appendChild(script);
    }

    const scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: 250
      },
      false
    );

    scanner.render(onScanSuccess);
  </script>

</body>
</html>
